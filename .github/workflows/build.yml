name: Build Kanata Warutsu Phonemizer

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out phonemizer project
        uses: actions/checkout@v4

      - name: Check out OpenUtau source for API references
        uses: actions/checkout@v4
        with:
          repository: openutau/OpenUtau
          path: OpenUtau

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build plugin
        shell: pwsh
        run: dotnet build KanataWarutsuPhonemizer.csproj --configuration Release --verbosity minimal

      - name: Upload DLL artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KanataWarutsuPhonemizer
          path: bin/Release/net10.0/KanataWarutsuPhonemizer.dll
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            **/obj/project.assets.json
            **/bin/**/*.dll
          if-no-files-found: ignore
          
